[project]
name = "transcribe-sensevoice-env"
version = "0.1.0"
description = "Python env for SenseVoice reference dumps and conversion (FunASR)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "triton>=3.8 ; sys_platform == 'linux'",
    # Exact pin: SenseVoiceSmall ships only on FunASR; the class registry,
    # state_dict layout, and `inference()` signature are framework-version
    # specific, and per-tensor tolerances will be captured against this
    # version. A silent bump can shift state_dict keys or hook points.
    "funasr==1.4.16",
    "torch>=2.15.0.dev0",
    "torchaudio>=2.11.0.dev0",
    # FunASR's loader resolves checkpoints via either modelscope or HF Hub
    # (hub="hf" on AutoModel). We use HF because the manifest pins an HF
    # revision; modelscope is left as a transitive dep brought in by funasr.
    "huggingface-hub>=0.30",
    "soundfile>=0.14.0",
    "librosa>=1.0.0",
    "numpy>=1.26",
    "gguf>=0.19.0",
    "sentencepiece>=0.2.2",
    "kaldiio>=2.18.1",
    # FunASR's WavFrontend uses kaldifeat-style fbank from torchaudio;
    # listed explicitly for clarity even though torchaudio brings the
    # implementation.
]

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
prerelease = "allow"
