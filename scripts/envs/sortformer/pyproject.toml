[project]
name = "transcribe-sortformer-env"
version = "0.1.0"
description = "Python env for Sortformer streaming diarizer reference dumps via NeMo (SortformerEncLabelModel)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=5.19.0",
    "triton>=3.8 ; sys_platform == 'linux'",
    "torch>=2.15.0.dev0",
    # Same NeMo pin as scripts/envs/parakeet: commit 6967f48fda2a already
    # ships streaming Sortformer (sortformer_modules with spkcache/AOSC/FIFO
    # and SortformerEncLabelModel.diarize(include_tensor_outputs=...)).
    "nemo-toolkit[asr]>=3.0.0",
    "huggingface-hub>=0.30",
    "soundfile>=0.14.0",
    "numpy>=1.26",
    "sentencepiece>=0.2.2",
    "gguf>=0.19.0",
    "meeteval>=0.4.3",
]

# NeMo main maps torch by platform: darwin->pypi (CPU), linux->cu129,
# windows->cpu. Restrict to the two we actually run on (laptop dumps
# on darwin, Modal sweeps on linux/cuda) so the resolver picks one
# torch source per split and the cpu/cu129 indexes do not collide.

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
