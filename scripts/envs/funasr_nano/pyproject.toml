[project]
name = "transcribe-funasr-nano-env"
version = "0.1.0"
description = "Python env for Fun-ASR-Nano reference dumps and conversion (FunASR + Qwen3 LLM via transformers)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "triton>=3.8 ; sys_platform == 'linux'",
    # Exact pin: FunASR's AutoModel registry, FunASRNano class layout, and
    # `inference()` / `generate()` signatures are framework-version specific.
    # Refreshed to 1.4.16; revalidate existing golden tensors before publishing.
    "funasr==1.4.16",
    # FunASR can use Transformers 5; qwen-asr's separate SDK still requires 4.57.6.
    "transformers==5.19.0",
    "torch>=2.15.0.dev0",
    "torchaudio>=2.11.0.dev0",
    "huggingface-hub>=0.30",
    "soundfile>=0.14.0",
    "librosa>=1.0.0",
    "numpy>=1.26",
    "gguf>=0.19.0",
    "sentencepiece>=0.2.2",
    "kaldiio>=2.18.1",
    "tiktoken>=0.14.0",
    "accelerate>=1.15.0",
    "safetensors>=0.8.0",
]

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
prerelease = "allow"
