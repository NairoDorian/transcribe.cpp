[project]
name = "transcribe-parakeet-kestrel-env"
version = "0.1.0"
description = "Python env for parakeet-ultra reference dumps via kestrel (Photon's engine)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "triton>=3.8 ; sys_platform == 'linux'",
    "kestrel==0.9.2",
    "kestrel-kernels==0.7.5",
    "kestrel-native==0.1.9",
    "torch>=2.15.0.dev0",
    "huggingface-hub>=0.30",
    "soundfile>=0.14.0",
    "numpy>=1.26",
]

# Laptop dumps on darwin (CPUKernelRuntime), Modal sweeps on linux/cuda.

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]
