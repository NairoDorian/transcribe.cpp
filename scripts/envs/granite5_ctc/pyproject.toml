[project]
name = "transcribe-granite5-ctc-env"
version = "0.1.0"
description = "Python env for IBM Granite Speech 5.0 TurboCTC reference dumps and conversion"
requires-python = ">=3.12,<3.13"
# transformers >= 5.16 is where `granite_speech5_ctc` / `granite_speech5_encoder`,
# GraniteSpeech5ForCTC, GraniteSpeech5FeatureExtractor and GraniteSpeech5Processor
# are registered (the checkpoint's config pins transformers_version=5.16.0.dev0).
# No trust_remote_code: config.json has no auto_map, so AutoModelForCTC resolves
# to these in-tree classes. The repo ALSO ships stale `ctc_conformer` remote code
# using granite-speech-4.x tensor names; it cannot load this checkpoint.
#
# torchaudio is a hard requirement, not an optional extra:
# GraniteSpeech5FeatureExtractor is decorated @requires(backends=("torch", "torchaudio"))
# and builds its mel filterbank with torchaudio.transforms.MelSpectrogram.
dependencies = [
    "triton>=3.8 ; sys_platform == 'linux'",
    "torch>=2.15.0.dev0",
    "torchaudio>=2.11.0.dev0",
    "gguf>=0.19.0",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "safetensors>=0.8.0",
    "soundfile>=0.14.0",
    "transformers>=5.19.0",
    "accelerate>=1.15.0",
]

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
prerelease = "allow"
