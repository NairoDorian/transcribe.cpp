[project]
name = "transcribe-whisper-env"
version = "0.1.0"
description = "Python env for Whisper ASR reference dumps (Transformers)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "triton>=3.8 ; sys_platform == 'linux'",
    "torch>=2.15.0.dev0",
    "gguf>=0.19.0",
    "huggingface-hub>=0.30",
    "librosa>=1.0.0",
    "safetensors>=0.8.0",
    "soundfile>=0.14.0",
    "numpy>=1.26",
    # Exact pin: HF stitching + long-form semantics (PRs #34537, #35750)
    # are version-specific, and the per-tensor tolerances baked into
    # tests/tolerances/whisper-*.json were captured against 5.6.1. A
    # refresh to 5.19.0 requires revalidating no_speech_prob capture and
    # seek/stride semantics before publishing new oracle results.
    "transformers==5.19.0",
]

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
prerelease = "allow"
