[project]
name = "transcribe-granite-nar-env"
version = "0.1.0"
description = "Python env for IBM Granite Speech NLE-NAR (non-autoregressive editor) reference dumps and conversion"
requires-python = ">=3.12,<3.13"
# Transformers refreshed to 5.19.0; revalidate the model-card oracle before publishing.
# NLE uses trust_remote_code;
# the modeling/configuration/feature_extraction code lives in the HF repo
# itself (configuration_nle.py, modeling_nle.py, feature_extraction_nle.py)
# and is registered via the config.auto_map. flash-attn is required for
# the NLE bidirectional LM forward (no causal mask, single pass).
dependencies = [
    "triton>=3.8 ; sys_platform == 'linux'",
    "torch>=2.15.0.dev0",
    "torchaudio>=2.11.0.dev0",
    "gguf>=0.19.0",
    "huggingface-hub>=0.30",
    "librosa>=1.0.0",
    "numpy>=1.26",
    "protobuf>=7.36.2",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "soundfile>=0.14.0",
    "transformers==5.19.0",
    "accelerate>=1.15.0",
]

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
prerelease = "allow"
