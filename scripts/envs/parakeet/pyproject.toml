[project]
name = "transcribe-parakeet-env"
version = "0.1.0"
description = "Python env for Parakeet reference dumps (NeMo) and Moondream HF safetensors conversion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "triton>=3.8 ; sys_platform == 'linux'",
    "huggingface-hub>=0.30",
    "soundfile>=0.14.0",
    "numpy>=1.26",
    "sentencepiece>=0.2.2",
    "gguf>=0.19.0",
    # NeMo lane (darwin/linux): reference dumps + conversion for the
    # nvidia/parakeet-* .nemo checkpoints. The torch requirement here is a
    # floor only; the nightly indexes below select the platform build.
    "torch>=2.15.0.dev0",
    "nemo-toolkit[asr]>=3.0.0 ; sys_platform != 'win32'",
    # HuggingFace lane (all platforms): NeMo does not install on win32, so the
    # moondream/parakeet-{ultra,redux} HF-safetensors variants are served
    # by transformers instead. transformers>=5 is required - ParakeetForTDT
    # (model_type "parakeet_tdt") only exists from the 5.x line; 4.x ships
    # ParakeetForCTC only.
    "transformers>=5.19.0",
    "safetensors==0.8.0 ; sys_platform == 'win32'",
    "omegaconf>=2.3,<2.4 ; sys_platform == 'win32'",
    "librosa>=1.0.0",
]

# Updated reference environments require Python 3.12 for NumPy/Librosa.
# CUDA 13.4 nightly packages share a build date through the lockfile.

[[tool.uv.index]]
name = "pytorch-nightly-cu134"
url = "https://download.pytorch.org/whl/nightly/cu134"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[tool.uv.sources]
triton = { index = "pytorch-nightly-cu134", marker = "sys_platform == 'linux'" }
torch = [
    { index = "pytorch-nightly-cu134", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-nightly-cpu", marker = "sys_platform == 'darwin'" },
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'", "sys_platform == 'win32'"]
prerelease = "allow"
